name: Tests and Security Checks

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip check
      - name: Python syntax check
        run: python -m compileall -q agents thyroid_tirads_ai tests cli.py enrichment.py simulator.py
      - name: Python regression tests
        run: python -m pytest -q
      - name: Browser JavaScript regression tests
        run: |
          node --check web/tirads.js
          node --check web/app.js
          node --test tests/test_web_tirads.cjs
      - name: Audit chain integrity
        run: python -c "from agents.base import AuditLogger; assert AuditLogger.verify_integrity()"
