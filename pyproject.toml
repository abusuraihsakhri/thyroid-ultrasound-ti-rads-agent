[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "thyroid-ultrasound-ti-rads-engine"
version = "2.0.0"
description = "ThyroidUltrasound Sentinel: ACR TI-RADS Multiparametric Feature Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
thyroid-ultrasound-ti-rads-engine = "thyroid_tirads_ai.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/thyroid-ultrasound-ti-rads-engine"
Repository = "https://github.com/abusuraihsakhri/thyroid-ultrasound-ti-rads-engine.git"
