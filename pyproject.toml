[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "thyroid-ultrasound-ti-rads-engine"
version = "2.0.0"
description = "ThyroidUltrasound Sentinel: ACR TI-RADS Multiparametric Feature Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.scripts]
thyroid-ultrasound-ti-rads-engine = "thyroid_tirads_ai.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/thyroid-ultrasound-ti-rads-agent"
Repository = "https://github.com/abusuraihsakhri/thyroid-ultrasound-ti-rads-agent"

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools]
packages = ["agents", "thyroid_tirads_ai"]
py-modules = ["cli", "enrichment", "simulator", "thyroid_tirads_ai_app"]
